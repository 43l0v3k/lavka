<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8553d">
<title>Лавка — объявления без комиссий</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#/"><span class="logo-mark">Л</span><span class="logo-text">Лавка</span></a>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Искать объявления" autocomplete="off" aria-label="Поиск">
      <button type="submit" aria-label="Найти">Найти</button>
    </form>
    <nav class="nav">
      <a href="#/favs" class="nav-i" title="Избранное">♡<span>Избранное</span></a>
      <a href="#/chats" class="nav-i" title="Сообщения">✉<span>Сообщения</span><b id="badge" hidden>0</b></a>
      <a href="#/me" class="nav-i" title="Профиль">☺<span id="navMe">Войти</span></a>
      <a href="#/new" class="btn btn-accent">+ Подать</a>
    </nav>
  </div>
</header>

<main id="view" class="wrap" aria-live="polite"></main>

<nav class="tabbar">
  <a href="#/" data-t="home">⌂<span>Главная</span></a>
  <a href="#/favs" data-t="favs">♡<span>Избранное</span></a>
  <a href="#/new" data-t="new" class="tab-plus">+</a>
  <a href="#/chats" data-t="chats">✉<span>Чаты</span><b id="badge2" hidden>0</b></a>
  <a href="#/me" data-t="me">☺<span>Профиль</span></a>
</nav>

<div id="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
