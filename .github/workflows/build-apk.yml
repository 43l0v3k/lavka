name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lavka-debug.apk

      # Скачать можно со страницы запуска (Artifacts)...
      - uses: actions/upload-artifact@v4
        with:
          name: lavka-apk
          path: lavka-debug.apk

      # ...или напрямую из раздела Releases (удобнее с телефона)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" lavka-debug.apk \
            --title "Лавка, сборка #${{ github.run_number }}" \
            --notes "Debug APK. Установи на телефон и впиши адрес сервера в Профиле."
